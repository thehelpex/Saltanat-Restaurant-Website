kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
DJANGO_SETTINGS_MODULE = "saltanat_api.settings"

[services.production.run]
args = ["python3", "-m", "gunicorn", "saltanat_api.wsgi:application", "--bind", "0.0.0.0:8080", "--workers", "2"]

[services.production.run.env]
PORT = "8080"
DJANGO_SETTINGS_MODULE = "saltanat_api.settings"
PYTHONPATH = "artifacts/api-server"

[services.production.health.startup]
path = "/api/healthz"
