kind = "web"
previewPath = "/"
title = "Saltanat Restaurant"
description = "A polished website for Saltanat Restaurant in Karachi, featuring its menu, dining experience, table reservations, and event inquiries."
version = "1.0.0"
id = "artifacts/saltanat-restaurant"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23336

[services.development]
run = "pnpm --filter @workspace/saltanat-restaurant run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/saltanat-restaurant", "run", "build" ]
serve = "static"
publicDir = "artifacts/saltanat-restaurant/out"


[services.env]
PORT = "23336"
BASE_PATH = "/"
